name: Build

on: push

env:
  CARGO_TERM_COLOR: always
#  CROSS_BUILD_OPTS: --cache-from type=gha --cache-to type=gha,mode=max
#  CROSS_DEBUG: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-01-03
          targets: ${{ matrix.target }}
      - name: Cache Rust project
        uses: Swatinem/rust-cache@v2
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cross-compile release binary
        run: "cross build --target ${{ matrix.target }} --locked --release"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/serri

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Parcel cache
        uses: actions/cache@v4
        with:
          path: .parcel-cache
          key: parcel-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build frontend dist
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
